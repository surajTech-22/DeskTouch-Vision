name: DeskTouch Vision - Android APK and input protocol tests

on:
  push:
    branches: ['**']
    paths:
      - 'AndroidDeskTouch/**'
      - '.github/workflows/android-desktouch.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['DeskTouch Vision - Build, Install, Release']
    types: [completed]

permissions:
  contents: write

jobs:
  android:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: AndroidDeskTouch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android unit tests and development-only debug build
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify existing permanent signing identity for official builds
        if: >-
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.head_branch == 'main') ||
          ((github.event_name == 'workflow_dispatch' ||
            github.event_name == 'push') &&
           github.ref == 'refs/heads/main')
        env:
          KEYSTORE_B64: ${{ secrets.DESKTOUCH_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DESKTOUCH_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DESKTOUCH_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DESKTOUCH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Release artifacts MUST use the approved, permanent certificate.
          # If a secret is missing, FAIL; never quietly publish a debug APK.
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" ||
                -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Permanent Android signing secrets are not configured. Refusing an ephemeral debug-signed release."
            exit 1
          fi
          umask 077
          signing_file="$RUNNER_TEMP/desktouch-android-release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$signing_file"
          if [[ ! -s "$signing_file" ]]; then
            echo "::error::Android private signing keystore is empty"
            exit 1
          fi
          actual_fingerprint="$(keytool -exportcert -storetype PKCS12             -keystore "$signing_file" -storepass "$STORE_PASSWORD"             -alias "$KEY_ALIAS" 2>/dev/null | sha256sum | cut -d ' ' -f1)"
          expected_fingerprint="56b2e0078f8d7b07ab21c6e63f1258622fdea081bac83698d02f11bd4e66c9c6"
          if [[ "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "::error::Android certificate does not match the permanent DeskTouch Vision signing identity."
            exit 1
          fi
          # The keystore is never uploaded as an artifact or committed to Git.
          echo "DESKTOUCH_SIGN_STORE_FILE=$signing_file" >> "$GITHUB_ENV"
          echo "Permanent DeskTouch Android signing certificate verified."

      - name: Assemble production APK with permanent certificate
        if: >-
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.head_branch == 'main') ||
          ((github.event_name == 'workflow_dispatch' ||
            github.event_name == 'push') &&
           github.ref == 'refs/heads/main')
        env:
          DESKTOUCH_SIGN_STORE_PASSWORD: ${{ secrets.DESKTOUCH_ANDROID_STORE_PASSWORD }}
          DESKTOUCH_SIGN_KEY_ALIAS: ${{ secrets.DESKTOUCH_ANDROID_KEY_ALIAS }}
          DESKTOUCH_SIGN_KEY_PASSWORD: ${{ secrets.DESKTOUCH_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
          # Verify the FINAL APK, not merely the keystore, has the permanent
          # v0.3.8+ signing identity. A debug signer must never be published.
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$apksigner"
          test -x "$aapt"
          signer="$("$apksigner" verify --print-certs "$apk")"
          echo "$signer" | grep -F '56b2e0078f8d7b07ab21c6e63f1258622fdea081bac83698d02f11bd4e66c9c6'
          # Debug-only ADB test receiver and probe screens must never appear in
          # the production Android package that users install.
          manifest="$("$aapt" dump xmltree "$apk" AndroidManifest.xml)"
          if echo "$manifest" | grep -E 'DebugRemoteInputReceiver|InputProbeActivity|ExternalEditorProbeActivity'; then
            echo "::error::Debug input probe leaked into signed production APK"
            exit 1
          fi
          echo "Signed release certificate and production manifest verified."
          cp "$apk" DeskTouchVision-android-preview.apk

      - name: Stage unsigned-to-production debug test artifact for development branches only
        if: >-
          (github.event_name == 'push' &&
           github.ref != 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref != 'refs/heads/main')
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DeskTouchVision-android-preview.apk
          echo "Development test only. The debug APK is NOT a production update."

      - name: Hash and upload APK build artifact
        run: |
          test -s DeskTouchVision-android-preview.apk
          sha256sum DeskTouchVision-android-preview.apk > DeskTouchVision-android-preview.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DeskTouchVision-Android-Artifact
          path: |
            AndroidDeskTouch/DeskTouchVision-android-preview.apk
            AndroidDeskTouch/DeskTouchVision-android-preview.apk.sha256
          if-no-files-found: error

      - name: Attach ONLY permanent-key-signed Android APK to matching official release
        # Workflow-run is the normal path after Windows finishes. A main
        # push/explicit dispatch may also attach if the official Windows ZIP
        # and checksum already exist; that recovers from delayed Windows
        # workflow finalization without weakening signing or release gates.
        if: >-
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.head_branch == 'main') ||
          ((github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch') &&
           github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(grep 'versionName' app/build.gradle | head -1 | sed -E "s/.*'([^']+)'.*/\1/")"
          tag="v${version}"
          event="${{ github.event_name }}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [[ "$event" == "workflow_run" ]]; then
              echo "::error::Windows release missing after successful Windows workflow."
              exit 1
            fi
            echo "Windows release not staged yet; workflow_run will attach the same permanently signed APK."
            exit 0
          fi
          # Do not publish an Android update unless Windows passed its own
          # package pipeline and attached both verified official artifacts.
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name' --repo "${{ github.repository }}")"
          if ! echo "$assets" | grep -Fxq 'DeskTouchVision-win-x64.zip' ||
             ! echo "$assets" | grep -Fxq 'DeskTouchVision-win-x64.zip.sha256'; then
            if [[ "$event" == "workflow_run" ]]; then
              echo "::error::Official Windows ZIP/checksum missing."
              exit 1
            fi
            echo "Windows files not complete; skip early main push, workflow_run will finish."
            exit 0
          fi
          if echo "$assets" | grep -Fxq 'DeskTouchVision-android-preview.apk' &&
             echo "$assets" | grep -Fxq 'DeskTouchVision-android-preview.apk.sha256'; then
            echo "The paired, permanently signed Android release is already present; no duplicate update notification."
            exit 0
          fi
          gh release upload "$tag" DeskTouchVision-android-preview.apk DeskTouchVision-android-preview.apk.sha256 --clobber --repo "${{ github.repository }}"
          final="$(gh release view "$tag" --json assets --jq '.assets[].name' --repo "${{ github.repository }}")"
          for expected in DeskTouchVision-win-x64.zip DeskTouchVision-win-x64.zip.sha256 DeskTouchVision-android-preview.apk DeskTouchVision-android-preview.apk.sha256; do
            echo "$final" | grep -Fx "$expected"
          done
          # Announce only after both matching signed Android and Windows
          # artifacts exist on the same official release.
          curl -fsS --retry 3 -X POST -H 'Content-Type: text/plain' --data "desktouch-release:$tag" 'https://ntfy.sh/desktouch-vision-surajtech22-qrp9f4x2'
          echo "Coordinated DeskTouch Windows + Android release announced: $tag"

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/desktouch-android-release.p12"
