name: DeskTouch Vision - Build, Install, Release

on:
  push:
    branches: [main]
    paths:
      - "DeskTouchVision/**"
      - ".github/workflows/desktouch-vision.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Verify installer, updater and diagnostics PowerShell syntax
        shell: pwsh
        run: |
          foreach ($path in @('DeskTouchVision/Install-DeskTouch.ps1',
                              'DeskTouchVision/Update-DeskTouch.ps1',
                              'DeskTouchVision/CHECK_DESKTOUCH.ps1',
                              'DeskTouchVision/CHECK_CONNECTION.ps1',
                              'DeskTouchVision/RECOVER_DESKTOUCH.ps1',
                              'DeskTouchVision/VERIFY_DESKTOUCH_PAYLOAD.ps1',
                              'DeskTouchVision/CHECK_SECURITY_STATUS.ps1',
                              'DeskTouchVision/TEST_PAYLOAD_INTEGRITY.ps1',
                              'DeskTouchVision/TEST_UPDATE_DIRECTORY_LOCK.ps1',
                              'DeskTouchVision/TEST_TRAY_UPDATES.ps1',
                              'DeskTouchVision/DeviceSharing/ALLOW_PRIVATE_LAN.ps1',
                              'DeskTouchVision/TEST_INSTALL_MUTEX.ps1',
                              'DeskTouchVision/CHECK_UPDATE_LOCK.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse error in $path : $($errors -join '; ')" }
          }
      - name: Verify install mutex released before slow cleanup (PowerShell 5.1)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'DeskTouchVision/TEST_INSTALL_MUTEX.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Installer mutex regression test failed" }
      - name: Verify detached Windows updater can rename app directory
        shell: pwsh
        run: |
          # A PowerShell script throws on failure; LASTEXITCODE is not
          # defined by a successfully invoked .ps1 and may be stale.
          & 'DeskTouchVision/TEST_UPDATE_DIRECTORY_LOCK.ps1'
      - name: Verify both Windows tray and auto-update paths (PowerShell 5.1)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'DeskTouchVision/TEST_TRAY_UPDATES.ps1'
          if ($LASTEXITCODE -ne 0) { throw "DeskTouch tray auto-update integration regression failed" }
      - name: Verify missing or tampered Windows executable is never installed
        shell: pwsh
        run: |
          & 'DeskTouchVision/TEST_PAYLOAD_INTEGRITY.ps1'
      - name: Check local hardware priority regression tests
        shell: pwsh
        run: |
          dotnet run --project DeskTouchVision/DeviceSharing.PolicyTests/DeviceSharing.PolicyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Input priority regression tests failed" }
      - name: Publish both self-contained Windows applications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish DeskTouchVision/DeskTouchVision.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o DeskTouchVision/dist/app
          if ($LASTEXITCODE -ne 0) { throw "DeskTouch main application failed" }
          dotnet publish DeskTouchVision/DeviceSharing/DeviceSharing.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -o DeskTouchVision/dist/app/DeviceSharing
          if ($LASTEXITCODE -ne 0) { throw "Windows device-sharing module failed" }
          if (!(Test-Path DeskTouchVision/dist/app/DeviceSharing/DeskTouch.DeviceShare.deps.json) -or
              !(Test-Path DeskTouchVision/dist/app/DeviceSharing/DeskTouch.DeviceShare.runtimeconfig.json) -or
              @(Get-ChildItem -Path DeskTouchVision/dist/app/DeviceSharing -Filter *.dll).Count -lt 10) {
            throw "Standard .NET Windows sharing files not published"
          }
          if (!(Test-Path 'DeskTouchVision/dist/app/DeviceSharing/DeskTouch.DeviceShare.exe')) {
            throw "Windows device-sharing module missing from installable app"
          }
          # Explicit file integrity records are inside the official ZIP,
          # which itself is SHA-256 verified before install/update.
          $app = 'DeskTouchVision/dist/app'
          $required = @('DeskTouchVision.exe','DeviceSharing/DeskTouch.DeviceShare.exe',
            'DeviceSharing/DeskTouch.DeviceShare.deps.json','DeviceSharing/DeskTouch.DeviceShare.runtimeconfig.json',
            'Update-DeskTouch.ps1','VERIFY_DESKTOUCH_PAYLOAD.ps1','CHECK_SECURITY_STATUS.ps1')
          foreach ($relative in $required) {
            $item = Join-Path $app ($relative -replace '/', '\')
            if (!(Test-Path -LiteralPath $item -PathType Leaf)) {
              throw "Published payload missing required file: $relative"
            }
          }
          # Standard .NET publish ships executable plus runtime DLLs. Verify
          # every file, not only the EXE, so partial AV extraction fails closed.
          $entries = @(Get-ChildItem -LiteralPath $app -Recurse -File |
            Where-Object { $_.Name -ne 'payload-integrity.json' } |
            Sort-Object FullName | ForEach-Object {
              $relative = $_.FullName.Substring(([IO.Path]::GetFullPath($app)).Length).TrimStart('\') -replace '\\','/'
              [pscustomobject]@{
                path = $relative
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                bytes = $_.Length
              }
            })
          [IO.File]::WriteAllText((Join-Path $app 'payload-integrity.json'),
            ([pscustomobject]@{schema=1;files=@($entries)} |
              ConvertTo-Json -Depth 5), [Text.Encoding]::UTF8)
          & 'DeskTouchVision/VERIFY_DESKTOUCH_PAYLOAD.ps1' -Root $app
      - name: Package installer + SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item DeskTouchVision/Install-DeskTouch.ps1 DeskTouchVision/dist/
          Copy-Item DeskTouchVision/INSTALL_DESKTOUCH.cmd DeskTouchVision/dist/
          Copy-Item DeskTouchVision/CHECK_DESKTOUCH.ps1 DeskTouchVision/dist/
          Copy-Item DeskTouchVision/CHECK_CONNECTION.ps1 DeskTouchVision/dist/
          Copy-Item DeskTouchVision/CHECK_UPDATE_LOCK.ps1 DeskTouchVision/dist/
          Copy-Item DeskTouchVision/RECOVER_DESKTOUCH.ps1 DeskTouchVision/dist/
          Copy-Item DeskTouchVision/CHECK_SECURITY_STATUS.ps1 DeskTouchVision/dist/
          Copy-Item DeskTouchVision/VERIFY_DESKTOUCH_PAYLOAD.ps1 DeskTouchVision/dist/
          New-Item -ItemType Directory -Force DeskTouchVision/published | Out-Null
          $zip = "DeskTouchVision/published/DeskTouchVision-win-x64.zip"
          Compress-Archive -Path DeskTouchVision/dist/* -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  DeskTouchVision-win-x64.zip" + [Environment]::NewLine, [Text.Encoding]::ASCII)
          if (-not (Test-Path "DeskTouchVision/dist/app/DeskTouchVision.exe")) { throw "App executable missing" }
          if (-not (Test-Path "DeskTouchVision/dist/app/DeviceSharing/DeskTouch.DeviceShare.exe")) { throw "Input-sharing executable missing" }
          if (-not (Test-Path "DeskTouchVision/dist/app/Update-DeskTouch.ps1")) { throw "Installed updater script missing" }
          if (-not (Test-Path "DeskTouchVision/dist/CHECK_DESKTOUCH.ps1")) { throw "Diagnostics script missing" }
          if (-not (Test-Path "DeskTouchVision/dist/CHECK_CONNECTION.ps1")) { throw "TCP pairing diagnostic missing" }
          if (-not (Test-Path "DeskTouchVision/dist/CHECK_UPDATE_LOCK.ps1")) { throw "Update lock diagnostic missing" }
          if (-not (Test-Path "DeskTouchVision/dist/RECOVER_DESKTOUCH.ps1")) { throw "Recovery script missing" }
          if (-not (Test-Path "DeskTouchVision/dist/app/payload-integrity.json")) { throw "Integrity manifest missing" }
          if (-not (Test-Path "DeskTouchVision/dist/CHECK_SECURITY_STATUS.ps1")) { throw "Antivirus diagnostic missing" }
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DeskTouchVision-Installer-win-x64
          path: DeskTouchVision/published/*
          if-no-files-found: error
      - name: Publish release for this app version (only once)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$proj = Get-Content "DeskTouchVision/DeskTouchVision.csproj"
          $appVersion = ([string]$proj.Project.PropertyGroup.Version).Split("-")[0]
          if ([string]::IsNullOrWhiteSpace($appVersion)) { throw "App version not set" }
          $tag = "v$appVersion"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Version/tag mismatch: $tag vs ${{ github.ref_name }}"
          }
          gh release view $tag --repo "${{ github.repository }}" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published; not altering the release"
          } else {
            gh release create $tag DeskTouchVision/published/DeskTouchVision-win-x64.zip DeskTouchVision/published/DeskTouchVision-win-x64.zip.sha256 --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "DeskTouch Vision $tag - Preview" --notes "EXPERIMENTAL v0.3.4: Standard self-contained .NET Windows sharing packaging (individual EXE and runtime DLLs instead of self-extracting single-file bundle). All published Windows files are SHA-256 verified after download, extraction and installation, with safe rollback if quarantined or incomplete. Defender diagnostics and multi-device LAN discovery/trusted reconnection remain unchanged. Antivirus may still flag binaries; report exact threat name to the vendor for false-positive review. No antivirus bypass, exclusions or code-signing claim. Android APK is still a preview and requires real-device testing."
            if ($LASTEXITCODE -ne 0) { throw "GitHub release creation failed" }
            Invoke-RestMethod -Method Post -Uri "https://ntfy.sh/desktouch-vision-surajtech22-qrp9f4x2" -Body "desktouch-release:$tag" -ContentType "text/plain" | Out-Null
            Write-Host "Release event sent: $tag"
          }
