name: Device Share Windows preview build (no release)

on:
  push:
    branches: [feature/native-lan-kvm, fix/device-sharing-responsive-ui, fix/updates-v0.2.2-diagnostics, fix/pairing-transport-v0.2.3, fix/update-directory-lock-v0.2.4, fix/recovery-checksum-winps51, fix/stable-duplex-peer-v0.2.5, fix/edge-handoff-ui-v0.2.6, fix/update-lock-lifecycle-v0.2.7, fix/slow-edge-tray-updates-v0.2.8, feat/trusted-device-autoreconnect-v0.2.9, fix/duplex-authority-v0.3.0, feature/android-desktouch-qr-v031, fix/android-tcp-rejected-v032, fix/windows-install-quarantine-integrity-v033, fix/standard-dotnet-packaging-v034, fix/defer-global-input-hooks-035, feature/multipeer-android-update-v036, fix/heartbeats-device-mesh-v037, feature/windows-controls-android-v039, fix/connected-windows-group-keyboard-v0310, fix/unified-group-input-v0311]
    paths:
      - 'DeskTouchVision/**'
      - '.github/workflows/device-share-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-kvm-preview:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check PowerShell installer and updater syntax
        shell: pwsh
        run: |
          foreach ($path in @('DeskTouchVision/Install-DeskTouch.ps1',
                              'DeskTouchVision/Update-DeskTouch.ps1',
                              'DeskTouchVision/CHECK_DESKTOUCH.ps1',
                              'DeskTouchVision/CHECK_CONNECTION.ps1',
                              'DeskTouchVision/RECOVER_DESKTOUCH.ps1',
                              'DeskTouchVision/VERIFY_DESKTOUCH_PAYLOAD.ps1',
                              'DeskTouchVision/CHECK_SECURITY_STATUS.ps1',
                              'DeskTouchVision/TEST_PAYLOAD_INTEGRITY.ps1',
                              'DeskTouchVision/TEST_UPDATE_DIRECTORY_LOCK.ps1',
                              'DeskTouchVision/TEST_TRAY_UPDATES.ps1',
                              'DeskTouchVision/DeviceSharing/ALLOW_PRIVATE_LAN.ps1',
                              'DeskTouchVision/TEST_INSTALL_MUTEX.ps1',
                              'DeskTouchVision/CHECK_UPDATE_LOCK.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Invalid PowerShell in $path : $($errors -join '; ')" }
          }
      - name: Verify install mutex released before slow cleanup (PowerShell 5.1)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'DeskTouchVision/TEST_INSTALL_MUTEX.ps1'
          if ($LASTEXITCODE -ne 0) { throw "Installer mutex regression test failed" }
      - name: Verify detached Windows updater can rename app directory
        shell: pwsh
        run: |
          # A PowerShell script throws on failure; LASTEXITCODE is not
          # defined by a successfully invoked .ps1 and may be stale.
          & 'DeskTouchVision/TEST_UPDATE_DIRECTORY_LOCK.ps1'
      - name: Verify recovery checksum in actual Windows PowerShell 5.1
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'DeskTouchVision/TEST_RECOVERY_CHECKSUM.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Recovery checksum test failed under Windows PowerShell 5.1.' }
      - name: Verify both Windows tray and auto-update paths (PowerShell 5.1)
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File 'DeskTouchVision/TEST_TRAY_UPDATES.ps1'
          if ($LASTEXITCODE -ne 0) { throw "DeskTouch tray auto-update integration regression failed" }
      - name: Test executable integrity checks including missing and modified binary
        shell: pwsh
        run: |
          & 'DeskTouchVision/TEST_PAYLOAD_INTEGRITY.ps1'
      - name: Verify native-input priority state machine
        shell: pwsh
        run: |
          dotnet run --project DeskTouchVision/DeviceSharing.PolicyTests/DeviceSharing.PolicyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Local physical input priority tests failed" }
      - name: Compile standalone Windows device sharing
        shell: pwsh
        run: |
          dotnet publish DeskTouchVision/DeviceSharing/DeviceSharing.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=false -o out/DeviceSharing
          if ($LASTEXITCODE -ne 0) { throw "Device share compile failed" }
          if (!(Test-Path out/DeviceSharing/DeskTouch.DeviceShare.deps.json) -or
              !(Test-Path out/DeviceSharing/DeskTouch.DeviceShare.runtimeconfig.json) -or
              @(Get-ChildItem -Path out/DeviceSharing -Filter *.dll).Count -lt 10) {
            throw "Expected standard .NET Windows sharing runtime files are missing"
          }
      - name: Compile existing DeskTouch Vision shell
        shell: pwsh
        run: |
          dotnet publish DeskTouchVision/DeskTouchVision.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
          if ($LASTEXITCODE -ne 0) { throw "App shell compile failed" }
      - name: Stage beta ZIP for laboratory testing only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/DeviceSharing | Out-Null
          if (!(Test-Path out/DeviceSharing/DeskTouch.DeviceShare.exe)) { throw "Device share app missing" }
          if (!(Test-Path out/DeskTouchVision.exe)) { throw "DeskTouch Vision app missing" }
          Compress-Archive -Path out/* -DestinationPath DeskTouch-Windows-KVM-UNTESTED.zip -CompressionLevel Optimal
          (Get-FileHash DeskTouch-Windows-KVM-UNTESTED.zip -Algorithm SHA256).Hash | Out-File -FilePath DeskTouch-Windows-KVM-UNTESTED.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: DeskTouch-Windows-KVM-UNTESTED
          path: |
            DeskTouch-Windows-KVM-UNTESTED.zip
            DeskTouch-Windows-KVM-UNTESTED.zip.sha256
          if-no-files-found: error
