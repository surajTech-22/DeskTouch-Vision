name: DeskTouch Windows-only shared environment - pre-release verification

on:
  push:
    branches: [feature/windows-only-stability-v0324]
    paths:
      - 'DeskTouchVision/**'
      - '.github/workflows/shared-environment-pre-release.yml'
      - '.github/workflows/desktouch-vision.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-environment:
    name: Windows - persistent TLS, native authority and package
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run live TLS hub, 3-client authority, 8-client stress tests twice
        shell: pwsh
        run: |
          foreach ($pass in @(1, 2)) {
            Write-Host "DeskTouch environment integration run $pass / 2"
            dotnet run --project DeskTouchVision/DeviceSharing.PolicyTests/DeviceSharing.PolicyTests.csproj -c Release
            if ($LASTEXITCODE -ne 0) { throw "Shared environment acceptance failed on run $pass" }
          }
      - name: Validate updater and package integrity without installing
        shell: pwsh
        run: |
          & 'DeskTouchVision/TEST_TRAY_UPDATES.ps1'
          & 'DeskTouchVision/TEST_PAYLOAD_INTEGRITY.ps1'
          & 'DeskTouchVision/TEST_UPDATE_DIRECTORY_LOCK.ps1'
      - name: Compile Windows runtime without publishing
        shell: pwsh
        run: |
          dotnet publish DeskTouchVision/DeviceSharing/DeviceSharing.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o preview/DeviceSharing
          if ($LASTEXITCODE -ne 0) { throw "Sharing runtime compile failed" }
          dotnet publish DeskTouchVision/DeskTouchVision.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o preview
          if ($LASTEXITCODE -ne 0) { throw "Windows app compile failed" }
          if (!(Test-Path preview/DeskTouchVision.exe) -or
              !(Test-Path preview/DeviceSharing/DeskTouch.DeviceShare.exe)) {
            throw "Missing required Windows preview executables"
          }
      - name: Assert Windows-only source and remove stale mobile artifacts
        shell: pwsh
        run: |
          if (Test-Path AndroidDeskTouch) { throw "Android project must be absent" }
          if (Test-Path preview/DeskTouchVision-android-preview.apk) { throw "Android APK in Windows-only package" }
          if (Test-Path preview/DeviceSharing/AndroidDeskTouch) { throw "Android binaries must not be bundled" }
          $form=Get-Content DeskTouchVision/DeviceSharing/DisplaySettingsForm.cs -Raw
          if ($form -match 'Get Android app|Android HID|Bluetooth check') { throw "Obsolete Android controls present" }
      - name: Record Windows test summary
        shell: pwsh
        run: |
          "source_sha=${{ github.sha }}" | Set-Content windows-verify.txt
          "environment_integration_passes=2" | Add-Content windows-verify.txt
          "hub_capacity_test=8_peers" | Add-Content windows-verify.txt
          "release_published=false" | Add-Content windows-verify.txt
          Get-FileHash preview/DeskTouchVision.exe -Algorithm SHA256 |
            ForEach-Object { "app_sha256=$($_.Hash)" } | Add-Content windows-verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DeskTouch-Windows-PreRelease-Verification
          path: windows-verify.txt
          if-no-files-found: error

