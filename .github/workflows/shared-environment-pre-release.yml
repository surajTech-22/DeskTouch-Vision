name: DeskTouch Shared Environment - pre-release verification (no publish)

on:
  push:
    branches: [fix/android-pointer-handoff-v0320, feature/android-ime-input-bridge-0319, fix/bluetooth-audit-stable-0318, feature/shared-environment-relay-v0312, fix/android-devices-visible-in-displays-v0313, fix/android-inline-display-native-input-v0314, fix/multidevice-authority-ime-updater-permissions-v0315, fix/unified-draggable-input-layout-v0316, fix/strict-screen-boundary-handoff-v0317]
    paths:
      - 'DeskTouchVision/**'
      - 'AndroidDeskTouch/**'
      - '.github/workflows/shared-environment-pre-release.yml'
      - '.github/workflows/android-desktouch.yml'
      - '.github/workflows/desktouch-vision.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-environment:
    name: Windows - multi-device TLS and packaging
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run live TLS hub, 3-client authority, 8-client stress tests twice
        shell: pwsh
        run: |
          foreach ($pass in @(1, 2)) {
            Write-Host "DeskTouch environment integration run $pass / 2"
            dotnet run --project DeskTouchVision/DeviceSharing.PolicyTests/DeviceSharing.PolicyTests.csproj -c Release
            if ($LASTEXITCODE -ne 0) { throw "Shared environment acceptance failed on run $pass" }
          }
      - name: Validate updater and package integrity without installing
        shell: pwsh
        run: |
          & 'DeskTouchVision/TEST_TRAY_UPDATES.ps1'
          & 'DeskTouchVision/TEST_PAYLOAD_INTEGRITY.ps1'
          & 'DeskTouchVision/TEST_UPDATE_DIRECTORY_LOCK.ps1'
      - name: Compile Windows runtime without publishing
        shell: pwsh
        run: |
          dotnet publish DeskTouchVision/DeviceSharing/DeviceSharing.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o preview/DeviceSharing
          if ($LASTEXITCODE -ne 0) { throw "Sharing runtime compile failed" }
          dotnet publish DeskTouchVision/DeskTouchVision.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o preview
          if ($LASTEXITCODE -ne 0) { throw "Windows app compile failed" }
          if (!(Test-Path preview/DeskTouchVision.exe) -or
              !(Test-Path preview/DeviceSharing/DeskTouch.DeviceShare.exe)) {
            throw "Missing required Windows preview executables"
          }
      - name: Record Windows test summary
        shell: pwsh
        run: |
          "source_sha=${{ github.sha }}" | Set-Content windows-verify.txt
          "environment_integration_passes=2" | Add-Content windows-verify.txt
          "hub_capacity_test=8_peers" | Add-Content windows-verify.txt
          "release_published=false" | Add-Content windows-verify.txt
          Get-FileHash preview/DeskTouchVision.exe -Algorithm SHA256 |
            ForEach-Object { "app_sha256=$($_.Hash)" } | Add-Content windows-verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DeskTouch-Windows-PreRelease-Verification
          path: windows-verify.txt
          if-no-files-found: error

  android-environment:
    name: Android - unit tests and APK compile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android protocol and discovery regression tests twice
        working-directory: AndroidDeskTouch
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "DeskTouch Android unit run $pass / 2"
            gradle --no-daemon :app:testDebugUnitTest
          done
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Record Android test summary without releasing APK
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "source_sha=${{ github.sha }}"
            echo "android_unit_passes=2"
            echo "production_signed=false"
            echo "release_published=false"
            echo "debug_apk_sha256=$(sha256sum AndroidDeskTouch/app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
          } > android-verify.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DeskTouch-Android-PreRelease-Verification
          path: android-verify.txt
          if-no-files-found: error

  android-emulator-smoke:
    name: Android emulator - launch shared-environment UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK for real app-process input probes
        working-directory: AndroidDeskTouch
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator hardware virtualization
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch Android app and verify core controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: default
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install AndroidDeskTouch/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.desktouch.vision android.permission.POST_NOTIFICATIONS
            adb shell am start -n com.desktouch.vision/.MainActivity
            bash .github/scripts/check-desktouch-emulator.sh
            bash .github/scripts/test-desktouch-input-emulator.sh
      - name: Preserve Android input acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeskTouch-Android-Real-Input-Acceptance
          path: android-input-emulator.txt
          if-no-files-found: ignore
